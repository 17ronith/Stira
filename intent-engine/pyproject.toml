[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stira-intent-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
